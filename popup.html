<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 300px;
      margin: 0;
      padding: 14px;
      background: #ffffff;
      color: #1f2937;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 4px 0;
    }
    #pageTitle {
      font-size: 12px;
      color: #6b7280;
      margin: 0 0 10px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 8px 0;
    }
    .row label {
      font-size: 12px;
      color: #6b7280;
      min-width: 48px;
    }
    .row select {
      flex: 1;
      font-size: 12px;
      padding: 5px 6px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #ffffff;
    }
    #sendBtn {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      background: #0d9488;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #sendBtn:hover {
      background: #0f766e;
    }
    #sendBtn:disabled {
      background: #9ca3af;
      cursor: default;
    }
    #allBtn {
      width: 100%;
      margin-top: 8px;
      padding: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #0d9488;
      background: #f0fdfa;
      border: 1px solid #99f6e4;
      border-radius: 8px;
      cursor: pointer;
    }
    #allBtn:hover {
      background: #ccfbf1;
    }
    #plan {
      font-size: 11px;
      color: #6b7280;
      margin: 10px 0 0 0;
      line-height: 1.4;
    }
    #history {
      margin: 12px 0 0 0;
      padding: 8px 0 0 0;
      border-top: 1px solid #e5e7eb;
    }
    #history h2 {
      font-size: 11px;
      font-weight: 600;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin: 0 0 6px 0;
    }
    .hrow {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #4b5563;
      padding: 2px 0;
    }
    .hrow .mark {
      width: 14px;
      text-align: center;
      font-weight: 700;
    }
    .mark.ok { color: #188038; }
    .mark.fail { color: #d93025; }
    .mark.working { color: #9ca3af; }
    .mark.saved { color: #0d9488; }
    .hrow .site {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hrow .svc {
      color: #9ca3af;
    }
    #empty {
      font-size: 11px;
      color: #9ca3af;
    }
    #footer {
      margin-top: 10px;
      text-align: right;
    }
    #optionsLink {
      font-size: 11px;
      color: #0d9488;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>Receipt Sender</h1>
  <p id="pageTitle">This page</p>
  <div class="row">
    <label for="service">Send to</label>
    <select id="service">
      <option value="sparkreceipt">SparkReceipt</option>
      <option value="expensify">Expensify</option>
    </select>
  </div>
  <div class="row" id="typeRow">
    <label for="sparkType">Type</label>
    <select id="sparkType">
      <option value="expense">Expense or receipt</option>
      <option value="income">Income or invoice</option>
      <option value="statement">Statement</option>
      <option value="other">Other document</option>
    </select>
  </div>
  <button id="sendBtn">Grab this page</button>
  <button id="allBtn">Grab all tabs in this window</button>
  <p id="plan"></p>
  <div id="history">
    <h2>Recent grabs</h2>
    <div id="historyList"><span id="empty">Nothing yet. Grab something.</span></div>
  </div>
  <div id="footer">
    <a href="#" id="optionsLink">Settings</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Receipt Sender</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    body {
      width: 320px;
      padding: 14px 14px 10px;
      font-size: 13px;
      background: var(--surface);
    }
    .top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 12px;
    }
    .top img {
      flex: none;
      border-radius: 7px;
    }
    .top div {
      min-width: 0;
    }
    h1 {
      font-size: 15px;
      line-height: 1.25;
      margin: 0;
      letter-spacing: -0.01em;
    }
    #pageTitle {
      font-size: 12px;
      color: var(--muted);
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row {
      display: grid;
      grid-template-columns: 58px 1fr;
      align-items: center;
      gap: 8px;
      margin: 0 0 8px;
    }
    .row[hidden] {
      display: none;
    }
    .row label {
      font-size: 12px;
      color: var(--muted);
    }
    .row select.field {
      min-height: 34px;
      padding: 0 8px;
      border-radius: 8px;
    }
    .actions {
      display: grid;
      gap: 8px;
      margin: 12px 0 0;
    }
    #sendBtn {
      min-height: 42px;
      font-size: 14px;
    }
    #allBtn {
      min-height: 36px;
      font-size: 12px;
    }
    #plan {
      font-size: 12px;
      color: var(--muted);
      margin: 10px 0 0;
      line-height: 1.45;
    }
    #status {
      font-size: 12px;
      margin: 6px 0 0;
      line-height: 1.45;
    }
    #status:empty {
      display: none;
    }

    /* Recent grabs sit on a strip of receipt paper */
    #history {
      --tooth: 5px;
      margin: 12px 0 0;
      padding: 9px 12px calc(9px + var(--tooth));
      background: var(--paper);
      border-radius: 8px 8px 0 0;
      -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / calc(2 * var(--tooth)) 100%;
      mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / calc(2 * var(--tooth)) 100%;
    }
    #history h2 {
      font-size: 12px;
      font-weight: 600;
      margin: 0 0 4px;
    }
    #historyList {
      /* Six and a half rows: the cut-off row hints that the list scrolls */
      max-height: 176px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--muted) transparent;
    }
    #historyList ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .hrow {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      padding: 4px 0;
      border-top: 1px dashed var(--line);
    }
    .hrow .mark {
      flex: none;
      width: 14px;
      text-align: center;
      font-weight: 700;
    }
    .mark.ok { color: var(--good); }
    .mark.fail { color: var(--bad); }
    .mark.working { color: var(--muted); }
    .mark.saved { color: var(--accent-text); }
    .hrow .site {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hrow .svc {
      flex: none;
      color: var(--muted);
    }
    #empty {
      margin: 0;
      padding: 4px 0 2px;
      font-size: 12px;
      color: var(--muted);
      border-top: 1px dashed var(--line);
    }
    #empty strong {
      display: block;
      color: var(--text);
    }
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 8px 0 0;
      font-size: 11px;
    }
    #optionsLink {
      min-height: 28px;
      padding: 0 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent-text);
      background: none;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
    #optionsLink:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header class="top">
    <img src="icons/icon48.png" alt="" width="30" height="30" />
    <div>
      <h1>Receipt Sender</h1>
      <p id="pageTitle">This Page</p>
    </div>
  </header>

  <main>
    <div class="row">
      <label for="service">Send To</label>
      <select id="service" class="field">
        <option value="sparkreceipt">SparkReceipt</option>
        <option value="expensify">Expensify</option>
      </select>
    </div>
    <div class="row" id="typeRow">
      <label for="sparkType">Type</label>
      <select id="sparkType" class="field">
        <option value="expense">Expense or Receipt</option>
        <option value="income">Income or Invoice</option>
        <option value="statement">Statement</option>
        <option value="other">Other Document</option>
      </select>
    </div>

    <div class="actions">
      <button type="button" id="sendBtn" class="btn btn-primary">Grab This Page</button>
      <button type="button" id="allBtn" class="btn btn-soft">Grab All Tabs in This Window</button>
    </div>

    <p id="plan" aria-live="polite"></p>
    <p id="status" role="status" aria-live="polite"></p>

    <section id="history" aria-labelledby="historyTitle">
      <h2 id="historyTitle">Recent Grabs</h2>
      <div id="historyList">
        <p id="empty"><strong>No Grabs Yet</strong>Grab a page and it shows up here.</p>
      </div>
    </section>
  </main>

  <footer>
    <span class="credit">Built by Harrison Ward Technology</span>
    <button type="button" id="optionsLink">Settings</button>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
